name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PRISMA_HIDE_UPDATE_MESSAGE: "1"

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  api-integration:
    name: API integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: vmt
          POSTGRES_PASSWORD: vmt
          POSTGRES_DB: vmt_test
        ports:
          - 5483:5432
        options: >-
          --health-cmd "pg_isready -U vmt -d vmt_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://vmt:vmt@localhost:5483/vmt_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run build:shared
      - run: bun run --filter @vmt/api test:int

  docker:
    name: API Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile --target runtime -t vmt-api:ci .
      - run: docker build -f apps/api/Dockerfile --target migrate -t vmt-api-migrate:ci .
