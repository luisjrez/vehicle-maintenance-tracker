<!doctype html>
<!--
  PROTOTYPE — throwaway. Question: "How should the core flows look and behave on mobile?"
  Three structurally different variants of the whole app, switchable via ?variant=A|B|C
  (floating bar at the bottom, or ← / → keys). In-memory state only; reload resets.
  A — Tabs + garage cards, single-scroll "Log work" form.
  B — Vehicle switcher home (one car at a time), floating "+" action sheet, 3-step wizard form.
  C — Timeline-first home across all cars, invoice-style form with per-line costs.
  Shared: add vehicle (type/scan VIN, invalid → "Add without VIN", review decoded details),
  scanner (VIN / Odometer / QR), odometer consistency by date, transfer via QR.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flows Prototype</title>
<style>
  :root { --bg:#e9ecef; --ink:#111; --muted:#6b7280; --line:#e5e7eb; --card:#fff; --accent:#0a84ff; --danger:#ff3b30; --ok:#34c759; --warn:#ff9f0a; --soft:#f2f2f7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; color:var(--ink); display:flex; justify-content:center; padding:24px 16px 96px; }
  .phone { width:390px; max-width:100%; height:844px; background:var(--soft); border-radius:44px; border:10px solid #111; overflow:hidden; position:relative; display:flex; flex-direction:column; box-shadow:0 20px 50px rgba(0,0,0,.25); }
  .status { height:44px; flex:none; display:flex; justify-content:space-between; align-items:center; padding:0 26px; font-weight:600; font-size:14px; }
  .screen { flex:1; overflow-y:auto; padding:0 16px 24px; position:relative; }
  h1 { font-size:30px; margin:6px 0 12px; }
  h2 { font-size:20px; margin:18px 0 8px; }
  h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:18px 4px 6px; font-weight:600; }
  .nav { display:flex; align-items:center; justify-content:space-between; min-height:44px; }
  .nav button { background:none; border:0; color:var(--accent); font-size:16px; padding:8px 0; cursor:pointer; }
  .nav .title { font-weight:600; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:10px; }
  .list { background:var(--card); border-radius:14px; overflow:hidden; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); gap:10px; cursor:pointer; }
  .row:last-child { border-bottom:0; }
  .muted { color:var(--muted); font-size:13px; }
  .big { font-size:26px; font-weight:700; }
  .btn { display:block; width:100%; border:0; border-radius:12px; padding:14px; font-size:16px; font-weight:600; background:var(--accent); color:#fff; cursor:pointer; margin:8px 0; }
  .btn.secondary { background:#fff; color:var(--accent); }
  .btn.danger { background:#fff; color:var(--danger); }
  .btn:disabled { opacity:.4; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 4px 4px; }
  input, select, textarea { width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:16px; background:#fff; font-family:inherit; }
  .err { color:var(--danger); font-size:13px; margin:4px 4px 0; }
  .okmsg { color:var(--ok); font-size:13px; margin:4px 4px 0; }
  .inline { display:flex; gap:8px; align-items:center; }
  .inline > * { flex:1; }
  .chip { display:inline-block; padding:7px 12px; border-radius:999px; background:#fff; margin:0 6px 6px 0; font-size:14px; cursor:pointer; border:1px solid var(--line); }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:4px; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .tabs { flex:none; display:flex; border-top:1px solid var(--line); background:#fff; padding-bottom:18px; }
  .tabs button { flex:1; background:none; border:0; padding:10px 0 4px; font-size:11px; color:var(--muted); cursor:pointer; }
  .tabs button.on { color:var(--accent); }
  .tabs .ico { font-size:22px; display:block; }
  .fab { position:absolute; right:20px; bottom:28px; width:60px; height:60px; border-radius:30px; background:var(--accent); color:#fff; font-size:32px; border:0; box-shadow:0 6px 16px rgba(10,132,255,.4); cursor:pointer; z-index:5; }
  .sheet-bg { position:absolute; inset:0; background:rgba(0,0,0,.35); z-index:10; display:flex; align-items:flex-end; }
  .sheet { background:var(--soft); width:100%; border-radius:18px 18px 0 0; padding:12px 16px 30px; max-height:85%; overflow-y:auto; }
  .grab { width:40px; height:5px; border-radius:3px; background:#c7c7cc; margin:0 auto 10px; }
  .carousel { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin:0 -16px; padding-left:16px; padding-right:16px; }
  .car-tile { flex:none; width:150px; background:#fff; border-radius:14px; padding:12px; cursor:pointer; border:2px solid transparent; }
  .car-tile.on { border-color:var(--accent); }
  .steps { display:flex; gap:6px; margin:6px 0 12px; }
  .steps i { flex:1; height:4px; border-radius:2px; background:var(--line); }
  .steps i.on { background:var(--accent); }
  .scanner { background:#000; color:#fff; border-radius:16px; height:380px; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .guide { border:3px solid #fff; border-radius:10px; width:85%; height:70px; box-shadow:0 0 0 999px rgba(0,0,0,.45); }
  .guide.qr { width:200px; height:200px; }
  .guide.odo { height:120px; }
  .guide.locked { border-color:var(--ok); }
  .scan-hint { position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:14px; }
  .scan-read { position:absolute; top:14px; left:0; right:0; text-align:center; font:600 16px ui-monospace,monospace; }
  .seg { display:flex; background:#e3e3e8; border-radius:9px; padding:2px; margin:10px 0; }
  .seg button { flex:1; border:0; background:none; padding:7px; border-radius:7px; font-size:14px; cursor:pointer; }
  .seg button.on { background:#fff; font-weight:600; }
  .qr { width:220px; height:220px; margin:10px auto; display:grid; grid-template-columns:repeat(21,1fr); background:#fff; padding:10px; border-radius:12px; }
  .qr i { display:block; }
  .alert { background:#fff4e5; border-radius:12px; padding:12px; margin:10px 0; font-size:14px; }
  .alert.red { background:#ffe8e6; }
  .month { font-size:13px; font-weight:600; color:var(--muted); margin:16px 4px 6px; }
  .tl { display:flex; gap:12px; background:#fff; border-radius:14px; padding:12px; margin-bottom:8px; cursor:pointer; }
  .tl .dot { width:38px; height:38px; flex:none; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; background:var(--soft); }
  table.inv { width:100%; border-collapse:collapse; background:#fff; border-radius:14px; overflow:hidden; }
  table.inv td { padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.inv input { padding:7px 8px; font-size:15px; }
  .proto-bar { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#ff2d92; color:#fff; border-radius:999px; display:flex; align-items:center; gap:4px; padding:6px; font:600 13px system-ui; box-shadow:0 8px 24px rgba(0,0,0,.3); z-index:100; }
  .proto-bar button { background:rgba(255,255,255,.2); color:#fff; border:0; border-radius:999px; width:32px; height:32px; font-size:16px; cursor:pointer; }
  .proto-bar span { padding:0 10px; white-space:nowrap; }
  .toast { position:absolute; left:16px; right:16px; bottom:100px; background:#111; color:#fff; padding:12px 14px; border-radius:12px; z-index:20; font-size:14px; }
</style>
</head>
<body>
<div class="phone"><div class="status"><span>9:41</span><span>●●● 􀙇 100%</span></div><div id="app" style="flex:1;display:flex;flex-direction:column;min-height:0;position:relative"></div></div>
<div class="proto-bar"><button data-proto="prev">←</button><span id="proto-label"></span><button data-proto="next">→</button></div>
<script>
/* ---------- mock data (in memory) ---------- */
const CATALOG = [
  { cat:'Routine Maintenance', items:['Oil & filter change','Tire rotation','Engine air filter','Cabin air filter','Scheduled maintenance','Wiper blades'] },
  { cat:'Brakes', items:['Brake pads (front)','Brake pads (rear)','Brake fluid flush','Rotor replacement'] },
  { cat:'Tires & Wheels', items:['New tires','Wheel alignment','Tire balance','Flat repair'] },
  { cat:'Electrical & Battery', items:['Battery replacement','Battery test','Alternator replacement'] },
  { cat:'Body & Paint', items:['Paint correction','Dent repair','Bumper repair'] },
  { cat:'Detailing & Appearance', items:['Car wash','Interior detailing','Full detailing','Ceramic coating'] },
  { cat:'Inspections & Registration', items:['State inspection','Emissions test','Registration renewal'] },
];
const COMMON = ['Oil & filter change','Tire rotation','Brake pads (front)','Battery replacement','New tires','Full detailing','State inspection','Wiper blades'];
const catOf = s => (CATALOG.find(c => c.items.includes(s)) || { cat:'Other' }).cat;
const ICON = { 'Routine Maintenance':'🛢', 'Brakes':'🛑', 'Tires & Wheels':'🛞', 'Electrical & Battery':'🔋', 'Body & Paint':'🎨', 'Detailing & Appearance':'✨', 'Inspections & Registration':'📋', 'Other':'🔧' };

let S = {
  vehicles: [
    { id:'v1', nickname:'Daily', make:'Honda', model:'Civic', year:2019, trim:'EX', vin:'2HGFC2F69KH512345', plate:'7ABC123 · CA', color:'Blue', initialOdo:41200, createdAt:'2026-03-02', details:{ 'Body class':'Sedan', 'Fuel':'Gasoline', 'Cylinders':'4', 'Displacement':'2.0 L', 'Drive':'FWD' } },
    { id:'v2', nickname:'', make:'Toyota', model:'RAV4', year:2022, trim:'XLE Hybrid', vin:'', plate:'', color:'White', initialOdo:18000, createdAt:'2026-05-10', details:{ 'Fuel':'Hybrid' } },
  ],
  records: [
    { id:'r1', vehicleId:'v1', date:'2025-11-14', odo:38900, provider:'Honda of Downtown', providerType:'Dealer', total:18950, notes:'', lines:[{ service:'Scheduled maintenance', cost:null, notes:'Maintenance Minder A1' },{ service:'Tire rotation', cost:null, notes:'' }] },
    { id:'r2', vehicleId:'v1', date:'2026-04-20', odo:43010, provider:'Discount Tire', providerType:'Chain', total:78400, notes:'', lines:[{ service:'New tires', cost:72000, notes:'4× Michelin CrossClimate 2' },{ service:'Wheel alignment', cost:6400, notes:'' }] },
    { id:'r3', vehicleId:'v1', date:'2026-09-05', odo:47750, provider:'', providerType:'DIY', total:4200, notes:'', lines:[{ service:'Engine air filter', cost:2100, notes:'' },{ service:'Cabin air filter', cost:2100, notes:'' }] },
    { id:'r4', vehicleId:'v2', date:'2026-08-12', odo:22500, provider:'Sparkle Detail Co.', providerType:'Independent shop', total:25000, notes:'', lines:[{ service:'Full detailing', cost:25000, notes:'' }] },
  ],
  route: { name:'home' }, stack: [], sheet:null, toast:null,
  selected:'v1', filter:'all', year:'all', draft:null, add:null, scan:null, transfer:null,
};

/* ---------- helpers ---------- */
const money = c => '$' + (c/100).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
const miles = n => n == null ? '—' : n.toLocaleString('en-US') + ' mi';
const fmtDate = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month:'2-digit', day:'2-digit', year:'numeric' });
const monthOf = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month:'long', year:'numeric' });
const veh = id => S.vehicles.find(v => v.id === id);
const vname = v => v.nickname ? v.nickname + ' · ' + v.year + ' ' + v.make + ' ' + v.model : v.year + ' ' + v.make + ' ' + v.model;
const recsOf = id => S.records.filter(r => r.vehicleId === id).sort((a,b) => b.date.localeCompare(a.date));
const curMiles = v => Math.max(v.initialOdo, ...recsOf(v.id).map(r => r.odo || 0));
const thisYear = '2026';
const spend = (id, year) => recsOf(id).filter(r => year === 'all' || r.date.startsWith(year)).reduce((s,r) => s + r.total, 0);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* VIN validation (same rules as ADR-0003) */
const TR = { A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9 };
const W = [8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];
function validateVin(raw) {
  const v = raw.replace(/[\s-]/g,'').toUpperCase();
  if (!v) return { v, state:'empty' };
  if (/[IOQ]/.test(v)) return { v, state:'bad', msg:'VINs never contain I, O or Q.' };
  if (!/^[A-Z0-9]*$/.test(v)) return { v, state:'bad', msg:'Only letters and digits.' };
  if (v.length < 17) return { v, state:'typing', msg:(17 - v.length) + ' characters to go' };
  if (v.length > 17) return { v, state:'bad', msg:'A VIN has exactly 17 characters.' };
  const sum = [...v].reduce((s,ch,i) => s + (/\d/.test(ch) ? +ch : TR[ch]) * W[i], 0);
  const check = sum % 11 === 10 ? 'X' : String(sum % 11);
  if (v[8] !== check) return { v, state:'bad', msg:'Check digit doesn’t match — a character is probably mistyped.' };
  return { v, state:'ok' };
}
function decode(vin) {
  if (vin.startsWith('1HG')) return { make:'Honda', model:'Accord', year:2003, trim:'EX', details:{ 'Body class':'Sedan', 'Fuel':'Gasoline', 'Cylinders':'4', 'Displacement':'2.4 L', 'Drive':'FWD' } };
  return { make:'Ford', model:'F-150', year:2021, trim:'XLT', details:{ 'Body class':'Pickup', 'Fuel':'Gasoline', 'Cylinders':'6', 'Displacement':'3.5 L', 'Drive':'4WD' } };
}

/* Odometer consistency by date (ADR-0007) */
function odoCheck(vehicleId, date, odo, ignoreId) {
  if (odo === '' || odo == null || isNaN(odo)) return null;
  const v = veh(vehicleId);
  const readings = [{ date:v.createdAt, odo:v.initialOdo, label:'initial odometer' }]
    .concat(S.records.filter(r => r.vehicleId === vehicleId && r.id !== ignoreId && r.odo != null).map(r => ({ date:r.date, odo:r.odo, label:'record on ' + fmtDate(r.date) })));
  const before = readings.filter(r => r.date <= date).sort((a,b) => b.odo - a.odo)[0];
  const after = readings.filter(r => r.date > date).sort((a,b) => a.odo - b.odo)[0];
  if (before && odo < before.odo) return 'Must be at least ' + miles(before.odo) + ' (' + before.label + ').';
  if (after && odo > after.odo) return 'Must be at most ' + miles(after.odo) + ' (' + after.label + ').';
  if (odo > 9999999) return 'Odometer looks too high.';
  return null;
}

/* ---------- navigation ---------- */
const variant = () => new URLSearchParams(location.search).get('variant') || 'A';
const VARIANTS = { A:'Tabs + garage cards', B:'Vehicle switcher + wizard', C:'Timeline-first + invoice form' };
function go(name, params) { S.stack.push(S.route); S.route = { name, ...params }; S.sheet = null; render(); }
function back() { S.route = S.stack.pop() || { name:'home' }; render(); }
function home() { S.stack = []; S.route = { name:'home' }; S.sheet = null; render(); }
function toast(msg) { S.toast = msg; render(); setTimeout(() => { S.toast = null; render(); }, 1800); }
function navbar(title, right) { return `<div class="nav"><button data-a="back">‹ Back</button><span class="title">${esc(title)}</span><span style="min-width:50px;text-align:right">${right || ''}</span></div>`; }

/* ---------- shared screens ---------- */
function vehicleHeader(v) {
  return `<div class="card"><div class="muted">${esc(v.nickname || 'Vehicle')}</div><div class="big">${v.year} ${esc(v.make)} ${esc(v.model)}</div>
  <div class="muted">${esc(v.trim || '')} ${v.plate ? '· ' + esc(v.plate) : ''}</div>
  <div class="inline" style="margin-top:10px"><div><div class="muted">Current mileage</div><b>${miles(curMiles(v))}</b></div><div><div class="muted">Spent in ${thisYear}</div><b>${money(spend(v.id, thisYear))}</b></div></div></div>`;
}
function reports(v) {
  const years = ['all', ...new Set(recsOf(v.id).map(r => r.date.slice(0,4)))];
  const rs = recsOf(v.id).filter(r => S.year === 'all' || r.date.startsWith(S.year));
  const byCat = {};
  rs.forEach(r => {
    const costed = r.lines.filter(l => l.cost != null);
    const rest = r.total - costed.reduce((s,l) => s + l.cost, 0);
    costed.forEach(l => byCat[catOf(l.service)] = (byCat[catOf(l.service)] || 0) + l.cost);
    if (rest > 0) { const c = catOf(r.lines[0].service); byCat[c] = (byCat[c] || 0) + rest; }
  });
  const total = rs.reduce((s,r) => s + r.total, 0);
  const max = Math.max(1, ...Object.values(byCat));
  return `<h3>Spending</h3><div>${years.map(y => `<span class="chip ${S.year === y ? 'on' : ''}" data-a="year" data-v="${y}">${y === 'all' ? 'All time' : y}</span>`).join('')}</div>
  <div class="card"><div class="muted">${S.year === 'all' ? 'Lifetime total' : 'Total ' + S.year}</div><div class="big">${money(total)}</div>
  ${Object.entries(byCat).sort((a,b) => b[1]-a[1]).map(([c,amt]) => `<div style="margin-top:10px"><div class="inline"><span>${ICON[c]} ${c}</span><span style="text-align:right">${money(amt)}</span></div><div class="bar"><i style="width:${amt/max*100}%"></i></div></div>`).join('') || '<div class="muted">No records yet.</div>'}</div>`;
}
function recordRow(r, showCar) {
  const v = veh(r.vehicleId);
  return `<div class="row" data-a="record" data-id="${r.id}"><div><div><b>${esc(r.lines.map(l => l.service).join(', '))}</b></div>
  <div class="muted">${fmtDate(r.date)} · ${miles(r.odo)}${r.provider ? ' · ' + esc(r.provider) : r.providerType === 'DIY' ? ' · DIY' : ''}${showCar ? ' · ' + esc(v.nickname || v.model) : ''}</div></div><b>${money(r.total)}</b></div>`;
}
function recordDetail() {
  const r = S.records.find(x => x.id === S.route.id); if (!r) return home();
  const v = veh(r.vehicleId);
  return navbar('Record', '<button data-a="editRecord" style="background:none;border:0;color:var(--accent);font-size:16px">Edit</button>') + `
  <div class="card"><div class="muted">${esc(vname(v))}</div><div class="big">${money(r.total)}</div><div class="muted">${fmtDate(r.date)} · ${miles(r.odo)}</div>
  <div class="muted">${esc(r.provider || '')}${r.providerType ? ' (' + r.providerType + ')' : ''}</div></div>
  <h3>Services</h3><div class="list">${r.lines.map(l => `<div class="row"><div>${ICON[catOf(l.service)]} ${esc(l.service)}${l.notes ? `<div class="muted">${esc(l.notes)}</div>` : ''}</div><span>${l.cost != null ? money(l.cost) : '<span class="muted">—</span>'}</span></div>`).join('')}</div>
  ${r.notes ? `<div class="card">${esc(r.notes)}</div>` : ''}
  <button class="btn danger" data-a="deleteRecord">Delete record</button>`;
}
function vehicleInfo() {
  const v = veh(S.route.id);
  const n = recsOf(v.id).length;
  return navbar('Vehicle details') + `<div class="list">
   ${[['Nickname',v.nickname],['Make',v.make],['Model',v.model],['Year',v.year],['Trim',v.trim],['VIN',v.vin || 'Not provided'],['Plate',v.plate],['Color',v.color],['Initial odometer',miles(v.initialOdo) + ' on ' + fmtDate(v.createdAt)],...Object.entries(v.details)].map(([k,val]) => `<div class="row"><span class="muted">${k}</span><span>${esc(val || '—')}</span></div>`).join('')}</div>
   <p class="muted" style="margin:0 4px">All details are editable (not wired in this prototype).</p>
   <button class="btn danger" data-a="deleteVehicle">Delete vehicle (${n} record${n === 1 ? '' : 's'} will be lost)</button>`;
}

/* add vehicle flow */
function addVehicle() {
  const a = S.add;
  if (a.step === 'vin') {
    const r = validateVin(a.vin);
    return navbar('Add vehicle') + `<h1>Add vehicle</h1>
    <label>VIN</label><div class="inline"><input id="vin" value="${esc(a.vin)}" placeholder="17 characters" autocapitalize="characters" style="font-family:ui-monospace,monospace;flex:3"><button class="btn secondary" style="margin:0;flex:1" data-a="scanVin">📷 Scan</button></div>
    ${r.state === 'bad' ? `<div class="err">${r.msg}</div>` : r.state === 'ok' ? '<div class="okmsg">✓ Valid VIN</div>' : r.msg ? `<div class="muted" style="margin:4px">${r.msg}</div>` : ''}
    <p class="muted" style="margin:8px 4px">Find it on the driver-side windshield or the door-jamb sticker. Try <code>1HGCM82633A004352</code>.</p>
    <button class="btn" data-a="decode" ${r.state === 'ok' ? '' : 'disabled'}>Look up vehicle</button>
    <button class="btn secondary" data-a="manual">Add without VIN</button>`;
  }
  const f = a.form;
  const odoErr = a.tried && (f.initialOdo === '' ? 'Required — enter or scan the current odometer.' : null);
  return navbar(a.step === 'review' ? 'Confirm details' : 'Add without VIN') + `
   ${a.step === 'review' ? `<div class="card"><div class="okmsg" style="margin:0">✓ Decoded from VIN ${esc(f.vin)}</div><div class="muted">Review and edit anything before saving.</div></div>` : ''}
   <div class="inline"><div><label>Year *</label><input data-f="year" value="${esc(f.year)}" inputmode="numeric"></div><div><label>Make *</label><input data-f="make" value="${esc(f.make)}"></div></div>
   <label>Model *</label><input data-f="model" value="${esc(f.model)}">
   <label>Trim</label><input data-f="trim" value="${esc(f.trim)}">
   ${Object.keys(f.details).length ? `<h3>Decoded details</h3><div class="list">${Object.entries(f.details).map(([k,v]) => `<div class="row"><span class="muted">${k}</span><span>${esc(v)}</span></div>`).join('')}</div>` : ''}
   <label>Current odometer *</label><div class="inline"><input data-f="initialOdo" value="${esc(f.initialOdo)}" inputmode="numeric" placeholder="miles" style="flex:3"><button class="btn secondary" style="margin:0;flex:1" data-a="scanOdo">📷 Scan</button></div>
   ${odoErr ? `<div class="err">${odoErr}</div>` : ''}

/* ---------- render ---------- */

  const app = document.getElementById('app');

  let html = '';
  if (r.name === 'home') html = V === 'A' ? homeA() : V === 'B' ? homeB() : homeC();
  else if (r.name === 'vehicle') html = V === 'B' ? (S.selected = r.id, S.route = { name:'home' }, homeB()) : vehicleA();
  else if (r.name === 'record') html = recordDetail();
  else if (r.name === 'vinfo') html = vehicleInfo();
  else if (r.name === 'add') html = addVehicle();
  else if (r.name === 'scan') html = scanner();
  else if (r.name === 'settings') html = settings();
  else if (r.name === 'transferOut') html = transferOut();
  else if (r.name === 'transferIn') html = transferIn();

  const focused = document.activeElement && document.activeElement.id ? document.activeElement.id : document.activeElement && document.activeElement.dataset && (document.activeElement.dataset.d || document.activeElement.dataset.f);
  app.innerHTML = `<div class="screen">${html}</div>${fab}${sheetB}${showTabs ? `<div class="tabs"><button class="${S.tab !== 'settings' ? 'on' : ''}" data-a="tab" data-v="garage"><span class="ico">🚗</span>Garage</button><button class="${S.tab === 'settings' ? 'on' : ''}" data-a="tab" data-v="settings"><span class="ico">⚙︎</span>Settings</button></div>` : ''}${S.toast ? `<div class="toast">${esc(S.toast)}</div>` : ''}`;
  if (focused) { const el = app.querySelector('#' + focused) || app.querySelector(`[data-d="${focused}"],[data-f="${focused}"]`); if (el) { el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch (_) {} } }

    manual: () => { S.add.step = 'manual'; S.add.form = { vin:'', make:'', model:'', year:'', trim:'', details:{}, initialOdo:'', nickname:'', plate:'', color:'' }; render(); },
    scanVin: () => startScan('vin', val => { S.add.vin = val; }), scanOdo: () => startScan('odo', val => { S.add.form.initialOdo = val; }),
    scanOdoDraft: () => startScan('odo', val => { S.draft.odo = val; }), scanQr: () => startScan('qr', () => { S.transfer = { step:'confirm' }; }),
    scanMode: () => { S.scan.mode = v; S.scan.locked = false; render(); setTimeout(() => { if (S.scan && S.route.name === 'scan') { S.scan.locked = true; render(); } }, 1500); },
    torch: () => toast('Torch toggled'), shutter: () => { S.scan.locked = true; render(); },
    useScan: () => { const val = { vin:'1HGCM82633A004352', odo:'47980', qr:'' }[S.scan.mode]; S.scan.onDone(val); back(); },
    saveVehicle: () => { const f = S.add.form; S.add.tried = true; if (f.initialOdo === '' || !f.make || !f.model || !f.year) return render();
      if (S.vehicles.length >= 20) return toast('Limit reached: 20 vehicles.');
      const nv = { id:'v' + Date.now(), nickname:f.nickname, make:f.make, model:f.model, year:+f.year, trim:f.trim, vin:f.vin, plate:f.plate, color:f.color, initialOdo:+f.initialOdo, createdAt:'2026-10-26', details:f.details };
      S.vehicles.push(nv); S.selected = nv.id; home(); toast('Vehicle added'); },
    logWork: () => { S.draft = newDraft(id || S.selected); go('log'); },
    openPicker: () => { d.pickerOpen = true; d.q = ''; render(); }, closePicker: () => { d.pickerOpen = false; render(); },
    pick: () => { if (v) d.lines.push({ service:v, cost:null, notes:'' }); d.pickerOpen = false; render(); },
    toggleLine: () => { const i = d.lines.findIndex(l => l.service === v); i >= 0 ? d.lines.splice(i, 1) : d.lines.push({ service:v, cost:null, notes:'' }); render(); },
    rmLine: () => { d.lines.splice(+el.dataset.i, 1); render(); }, ptype: () => { d.providerType = d.providerType === v ? '' : v; render(); },
    next: () => { const e = draftErrors(d); if (d.step === 0 && e.lines) { d.tried = true; return render(); } if (d.step === 1 && e.odo) { d.tried = true; return render(); } d.tried = false; d.step++; render(); },
    prev: () => { d.step--; render(); },
    saveRecord: () => { d.tried = true; const e = draftErrors(d); if (Object.keys(e).length) { if (variant() === 'B') d.step = e.lines ? 0 : e.odo ? 1 : 2; return render(); }
      const rec = { id: d.id || 'r' + Date.now(), vehicleId:d.vehicleId, date:d.date, odo: d.odo === '' ? null : +d.odo, provider:d.provider, providerType:d.providerType, total: Math.round(parseFloat(d.total) * 100) || 0, notes:d.notes,
        lines: d.lines.map(l => ({ ...l, cost: l.cost === '' || l.cost == null ? null : Math.round(parseFloat(l.cost) * 100) })) };
      S.records = S.records.filter(r => r.id !== rec.id).concat(rec); S.selected = d.vehicleId; S.stack.pop(); back(); toast(d.id ? 'Record updated' : 'Record saved'); },
    editRecord: () => { const r = S.records.find(x => x.id === S.route.id); S.draft = { ...newDraft(r.vehicleId), id:r.id, date:r.date, odo: r.odo ?? '', provider:r.provider, providerType:r.providerType, total:(r.total/100).toFixed(2), notes:r.notes, lines:r.lines.map(l => ({ ...l, cost: l.cost == null ? null : (l.cost/100).toFixed(2) })) }; go('log'); },
    deleteRecord: () => { S.records = S.records.filter(r => r.id !== S.route.id); back(); toast('Record deleted (after a confirm dialog)'); },
    deleteVehicle: () => { const vid = S.route.id; S.vehicles = S.vehicles.filter(x => x.id !== vid); S.records = S.records.filter(r => r.vehicleId !== vid); S.selected = S.vehicles[0] && S.vehicles[0].id; home(); toast('Vehicle deleted (after a confirm dialog)'); },
    transferOut: () => go('transferOut'), transferIn: () => { S.transfer = null; go('transferIn'); }, newCode: () => toast('New code — the previous one no longer works'),
    confirmTransfer: () => { home(); toast('Data received — old phone no longer has access'); },
  }[a];
  if (act) act();
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'vin') { S.add.vin = t.value; render(); }
  else if (t.id === 'q') { S.draft.q = t.value; render(); }
  else if (t.dataset.f) { S.add.form[t.dataset.f] = t.value; }
  else if (t.dataset.d) { S.draft[t.dataset.d] = t.value; if (['odo','date','total'].includes(t.dataset.d)) render(); }
  else if (t.dataset.line) { S.draft.lines[+t.dataset.line].cost = t.value; if (variant() === 'C') render(); }
  else if (t.dataset.lnote) { S.draft.lines[+t.dataset.lnote].notes = t.value; }
});
document.addEventListener('change', ev => { if (ev.target.dataset.d === 'vehicleId') { S.draft.vehicleId = ev.target.value; render(); } });
document.addEventListener('keydown', ev => {
  if (ev.target.matches('input, textarea, select, [contenteditable]')) return;
  if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') document.querySelector(`[data-proto="${ev.key === 'ArrowRight' ? 'next' : 'prev'}"]`).click();
});
render();
</script>
</body>
