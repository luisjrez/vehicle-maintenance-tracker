# Starts the dev build on a brand-new Device: clearing the keychain drops the stored
# Device ID, so the API creates a new Owner and every flow begins with an empty garage.
appId: dev.luisjrez.maintenancetracker
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- openLink: vmt://expo-development-client/?url=${METRO_URL}
# With its state cleared, the dev build opens the dev menu (and its onboarding) over
# the app once the bundle loads; it hides the app from the accessibility tree.
- extendedWaitUntil:
    visible: Toggle performance monitor
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: Toggle performance monitor
    commands:
      - tapOn:
          id: xmark
- extendedWaitUntil:
    visible:
      id: garage-empty
    timeout: 30000
