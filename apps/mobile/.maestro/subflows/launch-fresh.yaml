# Starts the dev build on a brand-new Device: clearing the keychain drops the stored
# Device ID, so the API creates a new Owner and every flow begins with an empty garage.
# The dev menu stays closed at launch through EXDevMenu* keys in app.json.
appId: dev.luisjrez.maintenancetracker
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- openLink: vmt://expo-development-client/?url=${METRO_URL}
- extendedWaitUntil:
    visible:
      id: garage-empty
    timeout: 60000
